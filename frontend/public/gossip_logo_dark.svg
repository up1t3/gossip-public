<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="bloomFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="840" height="240" rx="28" fill="url(#logoBg)"/>
  <rect width="836" height="236" x="2" y="2" rx="26" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Master Glider Icon Container -->
  <g transform="translate(50, 45)">
    <rect width="150" height="150" rx="36" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect width="150" height="150" rx="36" fill="none" stroke="url(#neonGradient)" stroke-width="2" opacity="0.4" />
    
    <!-- 3x3 Glider Grid Inside (Cell = 24x24, Gap = 6. Total = 84. Offset = (150-84)/2 = 33) -->
    <g transform="translate(33, 33)" filter="url(#bloomFilter)">
      <!-- Row 0: [0, 1, 0] -->
      <rect x="30" y="0" width="24" height="24" rx="6" fill="url(#neonGradient)" />
      <!-- Row 1: [0, 0, 1] -->
      <rect x="60" y="30" width="24" height="24" rx="6" fill="url(#neonGradient)" />
      <!-- Row 2: [1, 1, 1] -->
      <rect x="0" y="60" width="24" height="24" rx="6" fill="url(#neonGradient)" />
      <rect x="30" y="60" width="24" height="24" rx="6" fill="url(#neonGradient)" />
      <rect x="60" y="60" width="24" height="24" rx="6" fill="url(#neonGradient)" />
    </g>
  </g>

  <!-- Wordmark Typography -->
  <text x="235" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-1.5" fill="#ffffff">
    Gossip
  </text>

  <!-- MLS E2EE Badge -->
  <g transform="translate(510, 68)">
    <rect width="120" height="32" rx="8" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2"/>
    <text x="60" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      MLS E2EE
    </text>
  </g>

  <!-- Taglines -->
  <text x="237" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
    Zero-Knowledge &amp; Постквантовый Мессенджер
  </text>
  <text x="237" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" letter-spacing="0.2">
    Без номера телефона • 152-ФЗ Сейф-Контур • ML-KEM Kyber-1024
  </text>
</svg>
