<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gliderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Neon Glider Gradient (Cyber Emerald to Electric Cyan) -->
    <linearGradient id="gliderNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect width="512" height="512" rx="116" fill="url(#gliderBg)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="url(#gliderNeon)" stroke-width="2.5" opacity="0.35"/>

  <!-- Matrix Grid Accent (Subtle CRT Scanlines & Nodes) -->
  <g opacity="0.12" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="120" y1="120" x2="392" y2="120" />
    <line x1="120" y1="210" x2="392" y2="210" />
    <line x1="120" y1="300" x2="392" y2="300" />
    <line x1="120" y1="392" x2="392" y2="392" />
    
    <line x1="120" y1="120" x2="120" y2="392" />
    <line x1="210" y1="120" x2="210" y2="392" />
    <line x1="300" y1="120" x2="300" y2="392" />
    <line x1="392" y1="120" x2="392" y2="392" />
  </g>

  <!-- Conway's Glider Emblem (5 Pure Glowing Nodes) -->
  <!-- Grid: Cell size = 76x76, Gap = 18. Total = 3x76 + 2x18 = 264. Center offset = (512 - 264)/2 = 124 -->
  <g transform="translate(124, 124)" filter="url(#neonBloom)">
    <!-- Row 0: [0, 1, 0] -> Column 1 -->
    <rect x="94" y="0" width="76" height="76" rx="18" fill="url(#gliderNeon)" />
    
    <!-- Row 1: [0, 0, 1] -> Column 2 -->
    <rect x="188" y="94" width="76" height="76" rx="18" fill="url(#gliderNeon)" />
    
    <!-- Row 2: [1, 1, 1] -> Columns 0, 1, 2 -->
    <rect x="0" y="188" width="76" height="76" rx="18" fill="url(#gliderNeon)" />
    <rect x="94" y="188" width="76" height="76" rx="18" fill="url(#gliderNeon)" />
    <rect x="188" y="188" width="76" height="76" rx="18" fill="url(#gliderNeon)" />
  </g>
</svg>
